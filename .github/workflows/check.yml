name: check

# 目标 V2 E0：开发分支的每次推送也在干净环境运行检查，结果以 GitHub 上的记录为准。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # E1 对拍：test/differential.test.ts 调用 oracle/ 中的独立参考实现（Python 3.13 标准库）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
